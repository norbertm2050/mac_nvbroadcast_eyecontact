name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install av==18.1.0 numpy==2.5.3 pyvirtualcam==0.15.0
      - run: python -m unittest discover -s tests -v
